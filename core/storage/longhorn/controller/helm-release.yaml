apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 8m
  timeout: 20m # extend timeout to prevent accidental uninstall
  chart:
    spec:
      interval: 15m
      chart: longhorn
      version: "~1.11.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 0
      remediateLastFailure: false
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Enable Longhorn UI via Gateway API
    httproute:
      enabled: true
      parentRefs:
        - name: traefik
          namespace: networking
      hostnames:
        - "longhorn.deerlab.de"
