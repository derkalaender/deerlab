apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-deerlab-de
spec:
  secretName: wildcard-deerlab-de-tls # this created secret will hold the TLS certificate and private key
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.deerlab.de"
    - "deerlab.de"
