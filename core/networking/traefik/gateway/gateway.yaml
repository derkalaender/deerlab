apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik
spec:
  gatewayClassName: traefik

  # Allow routes from all namespaces
  listeners:
    - name: http
      protocol: HTTP
      port: 8000 # internal port for HTTP traffic
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 8443 # internal port for HTTPS traffic
      tls:
        mode: Terminate
        certificateRefs: # Use the wildcard certificate created by cert-manager
          - name: wildcard-deerlab-de-tls
      allowedRoutes:
        namespaces:
          from: All
