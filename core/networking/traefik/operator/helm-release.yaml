apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 8m
  timeout: 8m
  chart:
    spec:
      interval: 15m
      chart: traefik
      version: "~39"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values: # Traefik configuration
    providers:
      kubernetesGateway:
        enabled: true # Use modern Kubernetes Gateway API instead of the older Ingress API
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: true # Needed for Traefik's own CRDs, such as Middleware
        allowCrossNamespace: true # Allow Traefik to watch for CRDs across all namespaces, so we can define Middleware in the same namespace as the apps
    gateway:
      enabled: false # We will create a custom Gateway resource, so we disable the default one
    # Redirect HTTP to HTTPS
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
