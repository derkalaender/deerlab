apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: technitium-0
spec:
  parentRefs:
    - name: traefik
      namespace: networking
  hostnames:
    - "dns.deerlab.de"
    - "dns-0.deerlab.de"
  rules:
    - backendRefs:
        - name: technitium-0
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: technitium-1
spec:
  parentRefs:
    - name: traefik
      namespace: networking
  hostnames:
    - "dns-1.deerlab.de"
  rules:
    - backendRefs:
        - name: technitium-1
          port: 80
