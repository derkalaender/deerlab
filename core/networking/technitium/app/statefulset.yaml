apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: technitium
spec:
  replicas: 2
  service-name: technitium
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      containers:
        - name: technitium
          image: docker.io/technitium/dns-server:14.3.0
          # Ref.: https://github.com/TechnitiumSoftware/DnsServer/blob/master/docker-compose.yml
          ports:
            - name: http
              containerPort: 5380
              protocol: TCP
            - name: https
              containerPort: 53443
              protocol: TCP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
          envFrom:
            - configMapRef:
                name: technitium-config
          volumeMounts:
            - name: data
              mountPath: /etc/dns
            - name: tls-p12
              mountPath: /etc/dns/tls
              readOnly: true
      volumes:
        - name: tls-p12
          secret:
            secretName: ns-deerlab-de-tls
            items:
              - key: keystore.p12
                path: technitium.p12

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
