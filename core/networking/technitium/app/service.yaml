---
apiVersion: v1
kind: Service
metadata:
  name: technitium
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: technitium
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-0
spec:
  type: ClusterIP
  clusterIP: "10.70.1.100" # Needs to be stable for clustering to work, see https://blog.technitium.com/2025/11/understanding-clustering-and-how-to.html
  selector:
    app: technitium
    statefulset.kubernetes.io/pod-name: technitium-0 # Primary instance, syncs config to all other instances
  ports:
    # Web dashboard
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # Used for internal clustering
    - name: cluster-http
      port: 5380
      targetPort: http
      protocol: TCP
    - name: cluster-https
      port: 53443
      targetPort: https
      protocol: TCP
    - name: cluster-dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: cluster-dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-1
spec:
  type: ClusterIP
  clusterIP: "10.70.1.101"
  selector:
    app: technitium
    statefulset.kubernetes.io/pod-name: technitium-1
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: cluster-http
      port: 5380
      targetPort: http
      protocol: TCP
    - name: cluster-https
      port: 53443
      targetPort: https
      protocol: TCP
    - name: cluster-dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: cluster-dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
spec:
  type: LoadBalancer
  selector:
    app: technitium
    statefulset.kubernetes.io/pod-name: technitium-0 # Until setup is done, route only to main
  ipFamilyPolicy: PreferDualStack
  externalTrafficPolicy: Local
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
