---
apiVersion: v1
kind: Service
metadata:
  name: technitium
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: technitium
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-web
spec:
  type: ClusterIP
  selector:
    app: technitium
    statefulset.kubernetes.io/pod-name: technitium-0
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
spec:
  type: LoadBalancer
  selector:
    app: technitium
    statefulset.kubernetes.io/pod-name: technitium-0
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
