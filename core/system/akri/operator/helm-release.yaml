apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: akri
spec:
  interval: 8m
  timeout: 8m
  chart:
    spec:
      interval: 15m
      chart: akri
      version: "0.13.8"
      sourceRef:
        kind: HelmRepository
        name: akri
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values: # Akri configuration, currently we only need udev discovery
    udev:
      discovery:
        enabled: true
