---
apiVersion: v1
kind: Service
metadata:
  name: tinyauth
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: tinyauth
  ports:
    - name: http
      port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: tinyauth-web
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: tinyauth
    statefulset.kubernetes.io/pod-name: tinyauth-0
  ports:
    - name: http
      port: 80
      targetPort: http
