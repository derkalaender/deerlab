apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth
spec:
  forwardAuth:
    address: http://tinyauth.authentication.svc/api/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
      - Remote-User
      - Remote-Email
      - Remote-Name
      - Remote-Groups
