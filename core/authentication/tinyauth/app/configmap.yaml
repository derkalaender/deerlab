apiVersion: v1
kind: ConfigMap
metadata:
  name: tinyauth-config
data:
  APP_URL: "https://auth.deerlab.de"
  PROVIDERS_POCKETID_NAME: "Pocket ID"
  DISABLE_ANALYTICS: "true"

  PROVIDERS_POCKETID_AUTH_URL: "https://id.deerlab.de/authorize" # public; browser redirect to identity provider
  PROVIDERS_POCKETID_TOKEN_URL: "http://pocket-id-web.authentication.svc/api/oidc/token" # internal
  PROVIDERS_POCKETID_USER_INFO_URL: "http://pocket-id-web.authentication.svc/api/oidc/userinfo" # internal
  PROVIDERS_POCKETID_REDIRECT_URL: "https://auth.deerlab.de/api/oauth/callback/pocketid" # public; identity provider redirects back to tinyauth after successful login
  PROVIDERS_POCKETID_SCOPES: "openid,email,profile,groups"
  OAUTH_AUTO_REDIRECT: "pocketid"
