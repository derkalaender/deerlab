apiVersion: v1
kind: ConfigMap
metadata:
  name: tinyauth-config
data:
  APP_URL: "https://auth.deerlab.de"
  PROVIDERS_POCKETID_NAME: "Pocket ID"
  DISABLE_ANALYTICS: "true"

  PROVIDERS_POCKETID_AUTH_URL: "https://pocket-id.authentication.svc/authorize"
  PROVIDERS_POCKETID_TOKEN_URL: "https://pocket-id.authentication.svc/api/oidc/token"
  PROVIDERS_POCKETID_USER_INFO_URL: "https://pocket-id.authentication.svc/api/oidc/userinfo"
  PROVIDERS_POCKETID_REDIRECT_URL: "https://tinyauth.authentication.svc/api/oauth/callback/pocketid"
  PROVIDERS_POCKETID_SCOPES: "openid,email,profile,groups"
  OAUTH_AUTO_REDIRECT: "pocketid"
