apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id
  namespace: flux-system
spec:
  dependsOn:
    - name: local-path
    - name: traefik
  interval: 8m
  timeout: 8m
  retryInterval: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./core/authentication/pocket-id/app
  decryption:
    provider: sops
    secretRef:
      name: sops-age
