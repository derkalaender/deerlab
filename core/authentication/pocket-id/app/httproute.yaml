apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id
  namespace: authentication
spec:
  parentRefs:
    - name: traefik
      namespace: traefik-system
  hostnames:
    - "id.deerlab.de"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: pocket-id
          port: 80
