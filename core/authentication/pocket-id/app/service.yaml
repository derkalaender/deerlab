---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: pocket-id
  ports:
    - name: http
      port: 1411
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id-web
spec:
  type: ClusterIP
  selector:
    app: pocket-id
    statefulset.kubernetes.io/pod-name: pocket-id-0
  ports:
    - name: http
      port: 80
      targetPort: http
