apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik
  namespace: traefik-system
spec:
  gatewayClassName: traefik

  # Allow routes from all namespaces
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: # Use the wildcard certificate created by cert-manager
          - name: wildcard-deerlab-de-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
