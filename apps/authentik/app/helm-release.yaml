apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 8m
  timeout: 8m
  chart:
    spec:
      interval: 15m
      chart: authentik
      version: "2026.2.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: authentik-secrets
  values:
    authentik:
      postgresql:
        host: "postgres-rw.postgres.svc.cluster.local"
        port: 5432
        name: "authentik"
