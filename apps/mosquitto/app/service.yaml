---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: mosquitto
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-tls
spec:
  type: ClusterIP
  selector:
    app: mosquitto
    statefulset.kubernetes.io/pod-name: mosquitto-0
  ports:
    - name: mosquitto-tls
      port: 8883
      targetPort: mqtts
