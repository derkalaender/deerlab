apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-postgres
provisioner: driver.longhorn.io
reclaimPolicy: Retain # Don't nuke data on PVC deletion
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1" # CNPG handles replication, so we only need 1 replica at the storage level
  dataLocality: "strict-local" # Volume lives on same node as pod for maximum performance
  staleReplicaTimeout: "2880"
  fsType: "ext4"
