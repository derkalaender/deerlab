apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otbr
spec:
  parentRefs:
    - name: traefik
      namespace: networking
  hostnames:
    - "otbr.deerlab.de"
  rules:
    - backendRefs:
        - name: otbr
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth
