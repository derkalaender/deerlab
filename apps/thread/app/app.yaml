apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thread
spec:
  replicas: 1
  service-name: thread
  selector:
    matchLabels:
      app: thread
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            { "name": "multus-macvlan-dhcp",
              "namespace": "networking",
              "mac": "52:b7:05:0a:08:06" }
          ]
      labels:
        app: thread
    spec:
      containers:
        - name: otbr
          image: ghcr.io/ownbee/hass-otbr-docker:latest
          securityContext:
            privileged: true # TODO: restrict this with CAPS
          env:
            - name: DEVICE
              value: "/dev/ttyUSB0" # sonoff zbdongle-e
            - name: BACKBONE_IF
              value: "net1" # The macvlan interface created by Multus
            - name: BAUDRATE
              value: "460800"
            - name: FLOW_CONTROL
              value: "0"
            - name: OTBR_WEB_INTERFACE
              value: "0.0.0.0"
            - name: OTBR_WEB
              value: "0" # disable web interface, managed through home assistant
          ports:
            - name: otbr-rest
              containerPort: 8081
            - name: otbr-web
              containerPort: 8080
          volumeMounts:
            - name: otbr-data
              mountPath: /data/thread
            - name: dongle
              mountPath: /dev/ttyUSB0
            - name: tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              akri.sh/sonoff-zbdongle-e-thread: "1"
            limits:
              cpu: 200m
              memory: 256Mi
              akri.sh/sonoff-zbdongle-e-thread: "1"
        - name: matter
          image: ghcr.io/matter-js/python-matter-server:stable
          env:
            - name: TZ
              value: "Europe/Berlin"
          ports:
            - name: matter-ws
              containerPort: 5580
          volumeMounts:
            - name: matter-data
              mountPath: /data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: dongle
          hostPath:
            path: /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_62acf065a5c2ef11953dc6138148b910-if00-port0 # id-based path for stable device naming
        - name: tun
          hostPath:
            path: /dev/net/tun
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
  volumeClaimTemplates:
    - metadata:
        name: otbr-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path
    - metadata:
        name: matter-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: local-path
