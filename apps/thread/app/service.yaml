---
apiVersion: v1
kind: Service
metadata:
  name: thread
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: home-assistant
---
apiVersion: v1
kind: Service
metadata:
  name: otbr
spec:
  type: ClusterIP
  selector:
    app: thread
    statefulset.kubernetes.io/pod-name: thread-0
  ports:
    - name: otbr-rest
      port: 8081
      targetPort: otbr-rest
    - name: otbr-web
      port: 8086
      targetPort: otbr-web
