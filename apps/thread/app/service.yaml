---
apiVersion: v1
kind: Service
metadata:
  name: thread
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: home-assistant
---
apiVersion: v1
kind: Service
metadata:
  name: otbr
spec:
  type: ClusterIP
  selector:
    app: thread
    statefulset.kubernetes.io/pod-name: thread-0
  ports:
    - name: otbr-rest
      port: 8081
      targetPort: otbr-rest
    - name: otbr-web
      port: 8080
      targetPort: otbr-web
---
apiVersion: v1
kind: Service
metadata:
  name: matter
spec:
  type: ClusterIP
  selector:
    app: thread
    statefulset.kubernetes.io/pod-name: thread-0
  ports:
    - name: matter-ws
      port: 5580
      targetPort: matter-ws
