---
apiVersion: v1
kind: Service
metadata:
  name: zigbee
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: home-assistant
---
apiVersion: v1
kind: Service
metadata:
  name: zigbee-web
spec:
  type: ClusterIP
  selector:
    app: zigbee
    statefulset.kubernetes.io/pod-name: zigbee-0
  ports:
    - name: web
      port: 80
      targetPort: web
