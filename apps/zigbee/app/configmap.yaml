apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee-config
data:
  configuration.yaml: |
    version: 5

    devices: devices.yaml
    groups: groups.yaml

    mqtt:
      version: 5
      server: "mqtts://mosquitto-tls.apps.svc:8883"
      ca: "/certs/mqtt/ca.crt"
      key: "/certs/mqtt/tls.key"
      cert: "/certs/mqtt/tls.crt"

    serial:
      port: "/dev/ttyUSB0"
      baudrate: 115200
      adapter: ember

    frontend:
      enabled: true
      url: "https://zigbee.deerlab.de"
      package: zigbee2mqtt-windfront

    availability:
      enabled: true

    homeassistant:
      enabled: true

    advanced:
      log_output:
        - console
      last_seen: ISO_8601

      pan_id: GENERATE
      ext_pan_id: GENERATE
      network_key: GENERATE
      channel: 25
