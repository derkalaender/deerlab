apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee-config
data:
  configuration.yaml: |
    version: 5

    devices: devices.yaml
    groups: groups.yaml

    mqtt:
      version: 5
      server: "mqtts://mosquitto-tls.apps.svc:8883"
      ca: "/certs/mqtt/ca.crt"
      key: "/certs/mqtt/tls.key"
      cert: "/certs/mqtt/tls.crt"

    serial:
      port: "/dev/ttyUSB0"
      baudrate: 115200
      adapter: ember

    frontend:
      enabled: true
      url: "https://zigbee.deerlab.de"
      package: zigbee2mqtt-windfront

    availability:
      enabled: true

    homeassistant:
      enabled: true

    advanced:
      log_output:
        - console
      last_seen: ISO_8601

      pan_id: 53569
      ext_pan_id: [0xFA, 0xE4, 0x43, 0xDA, 0x08, 0x50, 0x86, 0xCE]
      network_key: [0xED, 0xBC, 0x03, 0x0B, 0x98, 0xCD, 0x30, 0xB1, 0x5B, 0xEA, 0x43, 0x50, 0xD8, 0x83, 0x2D, 0x1A]
      channel: 25
