apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocketid
  namespace: pocketid
spec:
  parentRefs:
    - name: traefik
      namespace: traefik-system
  hostnames:
    - "id.deerlab.de"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: pocketid
          port: 80
