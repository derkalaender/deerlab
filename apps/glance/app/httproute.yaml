apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glance
spec:
  parentRefs:
    - name: traefik
      namespace: networking
  hostnames:
    - "home.deerlab.de"
  rules:
    - backendRefs:
        - name: glance
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth
