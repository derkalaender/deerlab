apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glance-redirect
spec:
  parentRefs:
    - name: traefik
      namespace: networking
  hostnames:
    - "deerlab.de"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: home.deerlab.de
            statusCode: 301
