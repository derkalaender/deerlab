apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate # Fix "Please stop the existing instance before starting a new one."
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # Init container to copy default configuration files if they don't exist yet.
      initContainers:
        - name: init-config
          image: busybox:latest
          command: ["/init.sh"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: init-files
              mountPath: /config-init
            - name: init-script
              mountPath: /init.sh
              subPath: init.sh
      containers:
        - name: home-assistant
          image: "ghcr.io/home-assistant/home-assistant:stable"
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          envFrom:
            - configMapRef:
                name: home-assistant-config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-data
        - name: init-files
          configMap:
            name: home-assistant-init-files
        - name: init-script
          configMap:
            name: home-assistant-init-script
            defaultMode: 0755
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
