---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-web
spec:
  type: ClusterIP
  selector:
    app: home-assistant
    statefulset.kubernetes.io/pod-name: home-assistant-0
  ports:
    - name: http
      port: 80
      targetPort: http
