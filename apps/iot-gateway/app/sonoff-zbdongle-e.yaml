apiVersion: akri.sh/v0
kind: Configuration
metadata:
  name: sonoff-zbdongle-e
spec:
  discoveryHandler:
    name: udev
    discoveryDetails: |+
      groupRecursive: false
      udevRules:
      - 'KERNEL=="ttyUSB*", SUBSYSTEM=="tty", SUBSYSTEMS=="usb", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea60"'
  brokerProperties: {}
  capacity: 1
