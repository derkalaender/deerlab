---
apiVersion: v1
kind: Service
metadata:
  name: iot-gateway
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: home-assistant
  ports:
    - name: otbr-rest
      port: 8081
    - name: otbr-web
      port: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: otbr
spec:
  type: NodePort
  selector:
    app: iot-gateway
    statefulset.kubernetes.io/pod-name: iot-gateway-0
  ports:
    - name: otbr-rest
      port: 8081
      targetPort: otbr-rest
    - name: otbr-web
      port: 8086
      targetPort: otbr-web
