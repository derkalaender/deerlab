apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: sources
    - name: core
  interval: 5m
  timeout: 10m
  retryInterval: 1m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
  decryption:
    provider: sops
    secretRef:
      name: sops-age
